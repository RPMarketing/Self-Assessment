<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment skills self-check — RainPhil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d131c;
    --panel:#141b26;
    --panel-raised:#182130;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --text:#e7ecf2;
    --text-dim:#8a97a6;
    --text-faint:#526074;
    --green:#4fae7d;
    --amber:#d9a24b;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    line-height:1.6;
    padding-bottom:96px;
  }
  h1,h2,h3,.display{
    font-family:'Inter', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;}
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 24px;
  }
  header.page{
    margin-bottom:40px;
  }
  .kicker{
    color:var(--text-dim);
    font-size:13px;
    margin:0 0 10px;
  }
  h1{
    font-size:28px;
    color:var(--text);
  }
  .lede{
    color:var(--text-dim);
    max-width:56ch;
    margin-top:14px;
    font-size:14px;
  }

  .field-block{
    margin-bottom:28px;
  }
  label.field-label{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    max-width:340px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:11px 12px;
    border-radius:var(--radius);
  }
  input[type=text]:focus{
    outline:2px solid var(--green);
    outline-offset:1px;
    border-color:var(--green);
  }

  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    border:1px solid var(--border);
    background:var(--panel);
    padding:14px 16px;
    border-radius:var(--radius);
  }
  .legend-item{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .legend-num{
    font-weight:600;
    color:var(--text);
  }

  section.brand{
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:var(--radius);
    margin-bottom:16px;
    background:var(--panel);
    overflow:hidden;
  }
  .brand-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    cursor:pointer;
    user-select:none;
  }
  .brand-head:hover{background:var(--panel-raised);}
  .brand-name{
    font-family:'Inter', sans-serif;
    font-size:17px;
    font-weight:600;
  }
  .brand-meta{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:3px;
  }
  .brand-toggle{
    color:var(--text-faint);
    font-size:13px;
    font-family:'Inter', sans-serif;
  }
  .brand-body{
    border-top:1px solid var(--border);
    display:none;
  }
  section.brand.open .brand-body{display:block;}
  section.brand.open .brand-toggle{color:var(--green);}

  .model-row{
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px 26px;
  }
  .model-row:last-child{border-bottom:none;}
  .model-name{
    flex:1 1 100%;
    font-size:14px;
    color:var(--text);
  }
  .rate-group{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rate-group .rg-label{
    font-size:11.5px;
    color:var(--text-faint);
    width:92px;
  }
  .rg-buttons{
    display:flex;
    gap:5px;
  }
  .rg-buttons button{
    width:28px;
    height:28px;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:transparent;
    color:var(--text-dim);
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    cursor:pointer;
    transition:background .12s, color .12s, border-color .12s;
  }
  .rg-buttons button:hover{border-color:var(--text-dim);}
  .rg-buttons button.sel{
    background:var(--green);
    border-color:var(--green);
    color:#0d1a14;
    font-weight:600;
  }
  .rg-buttons button:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }

  footer.bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .bar-inner{
    max-width:760px;
    margin:0 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .progress-readout{
    font-size:13px;
    color:var(--text-dim);
  }
  .progress-readout .num{
    color:var(--text);
    font-weight:600;
  }
  .progress-track{
    width:140px;
    height:4px;
    background:var(--border-strong);
    border-radius:2px;
    overflow:hidden;
    display:inline-block;
    margin-left:10px;
    vertical-align:middle;
  }
  .progress-fill{
    height:100%;
    background:var(--green);
    width:0%;
    transition:width .2s;
  }
  button.submit{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 22px;
    border-radius:var(--radius);
    border:none;
    cursor:pointer;
    background:var(--text-faint);
    color:#0d131c;
  }
  button.submit.ready{
    background:var(--green);
    color:#0d1a14;
  }
  button.submit:disabled{cursor:not-allowed;}

  .status{
    margin-top:10px;
    font-size:13px;
  }
  .status.err{color:#e08a8a;}
  .status.ok{color:var(--green);}

  .done-screen{
    text-align:left;
    padding:60px 0;
  }
  .done-screen h2{font-size:22px;margin-bottom:12px;}
  .done-screen p{color:var(--text-dim); font-size:14px; max-width:48ch;}
  .again{
    margin-top:20px;
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text);
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-size:13px;
  }

  @media (max-width:560px){
    .wrap{padding:32px 16px 16px;}
    .rate-group{flex:1 1 100%;}
    .rate-group .rg-label{width:auto; margin-right:auto;}
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<footer class="bar" id="footerBar" style="display:none;">
  <div class="bar-inner">
    <div class="progress-readout">
      <span class="num" id="progressNum">0</span> / <span id="progressTotal">0</span> rated
      <span class="progress-track"><span class="progress-fill" id="progressFill"></span></span>
    </div>
    <button class="submit" id="submitBtn" disabled>Enter your name and rate every model to submit</button>
  </div>
</footer>

<script>
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const BRANDS = [
  { name: "Zybio", accent: "#5b8def", models: ["EXM3000", "EMX6000", "EXS2600"] },
  { name: "Bioer", accent: "#e2703a", models: ["Genepure Pro 9600", "Linegene 96000", "Quantgene 9600"] },
  { name: "MGI", accent: "#c75b8f", models: ["Cyclone", "E25", "G50", "G99", "G400"] },
  { name: "Thistle Scientific", accent: "#9b7fd4", models: ["Horizontal Electrophoresis", "Vertical Electrophoresis", "Power Supply", "GDH-BASIC Kit (Safeview)", "UV Transilluminator"] },
  { name: "Vilber Lourmat", accent: "#4fb8c4", models: ["Ebox", "Bioprint", "Fusion Series", "Newton"] },
  { name: "Denovix", accent: "#7fa65a", models: ["DS-11", "DS-11FX", "DS-11+", "DS-11FX+", "DSC", "QFX"] }
];

const LEVELS = [
  { v: 1, label: "Not familiar" },
  { v: 2, label: "Basic — needs supervision" },
  { v: 3, label: "Competent — independent on standard cases" },
  { v: 4, label: "Proficient — handles complex cases alone" },
  { v: 5, label: "Expert — could train others" }
];

const CRITERIA = [
  { key: "installation", label: "Installation" },
  { key: "troubleshooting", label: "Troubleshooting" },
  { key: "preventative", label: "Maintenance" },
  { key: "calibration", label: "Calibration" }
];

const TOTAL_MODELS = BRANDS.reduce((n, b) => n + b.models.length, 0);
const TOTAL_CRITERIA = TOTAL_MODELS * CRITERIA.length;
const DRAFT_KEY = "rainphil_skills_draft_v2";

let ratings = {};   // key "brand||model" -> { installation, troubleshooting, preventative }
let engineerName = "";

function keyOf(brand, model){ return brand + "||" + model; }

function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    engineerName = parsed.engineerName || "";
    ratings = parsed.ratings || {};
  }catch(e){ /* ignore corrupt draft */ }
}
function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ engineerName, ratings }));
  }catch(e){ /* storage unavailable, non-fatal */ }
}

function ratedCount(){
  let n = 0;
  for(const k in ratings){
    CRITERIA.forEach(c => { if(ratings[k][c.key]) n++; });
  }
  return n;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  const header = document.createElement("header");
  header.className = "page";
  header.innerHTML = `
    <p class="kicker">RainPhil field engineering</p>
    <h1>Equipment skills self-check</h1>
    <p class="lede">Rate yourself on installation, troubleshooting, preventive maintenance, and calibration for every model you may be assigned to. Answer where you actually stand today, not where you'd like to be — this shapes who gets called for each brand.</p>
  `;
  app.appendChild(header);

  const nameBlock = document.createElement("div");
  nameBlock.className = "field-block";
  nameBlock.innerHTML = `
    <label class="field-label" for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Juan Dela Cruz" value="${escapeAttr(engineerName)}">
  `;
  app.appendChild(nameBlock);

  const legend = document.createElement("div");
  legend.className = "legend field-block";
  legend.innerHTML = LEVELS.map(l => `<span class="legend-item"><span class="legend-num">${l.v}</span> ${l.label}</span>`).join("");
  app.appendChild(legend);

  BRANDS.forEach((brand, bi) => {
    const section = document.createElement("section");
    section.className = "brand";
    section.style.setProperty("--accent", brand.accent);
    section.dataset.brand = brand.name;

    const head = document.createElement("div");
    head.className = "brand-head";
    head.innerHTML = `
      <div>
        <div class="brand-name">${brand.name}</div>
        <div class="brand-meta">${brand.models.length} model${brand.models.length > 1 ? "s" : ""}</div>
      </div>
      <div class="brand-toggle">expand</div>
    `;
    head.addEventListener("click", () => {
      section.classList.toggle("open");
      head.querySelector(".brand-toggle").textContent = section.classList.contains("open") ? "collapse" : "expand";
    });
    section.appendChild(head);

    const body = document.createElement("div");
    body.className = "brand-body";

    brand.models.forEach(model => {
      const k = keyOf(brand.name, model);
      if(!ratings[k]) ratings[k] = { installation: 0, troubleshooting: 0, preventative: 0, calibration: 0 };

      const row = document.createElement("div");
      row.className = "model-row";
      row.innerHTML = `<div class="model-name">${model}</div>`;

      CRITERIA.forEach(c => {
        const group = document.createElement("div");
        group.className = "rate-group";
        const label = document.createElement("span");
        label.className = "rg-label";
        label.textContent = c.label;
        group.appendChild(label);

        const btnRow = document.createElement("div");
        btnRow.className = "rg-buttons";
        LEVELS.forEach(l => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = l.v;
          btn.title = l.label;
          if(ratings[k][c.key] === l.v) btn.classList.add("sel");
          btn.addEventListener("click", () => {
            ratings[k][c.key] = l.v;
            btnRow.querySelectorAll("button").forEach(b => b.classList.remove("sel"));
            btn.classList.add("sel");
            saveDraft();
            updateFooter();
          });
          btnRow.appendChild(btn);
        });
        group.appendChild(btnRow);
        row.appendChild(group);
      });

      body.appendChild(row);
    });

    section.appendChild(body);
    if(bi === 0) section.classList.add("open");
    app.appendChild(section);
  });

  document.getElementById("nameInput").addEventListener("input", e => {
    engineerName = e.target.value;
    saveDraft();
    updateFooter();
  });

  document.getElementById("footerBar").style.display = "flex";
  updateFooter();
}

function updateFooter(){
  const n = ratedCount();
  document.getElementById("progressNum").textContent = n;
  document.getElementById("progressTotal").textContent = TOTAL_CRITERIA;
  document.getElementById("progressFill").style.width = Math.round((n / TOTAL_CRITERIA) * 100) + "%";

  const btn = document.getElementById("submitBtn");
  const complete = n === TOTAL_CRITERIA && engineerName.trim().length > 0;
  btn.disabled = !complete;
  btn.classList.toggle("ready", complete);
  btn.textContent = complete ? "Submit self-check" : "Enter your name and rate every model to submit";
}

function escapeAttr(s){
  return String(s).replace(/"/g, "&quot;");
}

document.getElementById("submitBtn").addEventListener("click", submit);

async function submit(){
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Submitting…";

  const payload = {
    engineer: engineerName.trim(),
    ratings: Object.keys(ratings).map(k => {
      const [brand, model] = k.split("||");
      return { brand, model, installation: ratings[k].installation, troubleshooting: ratings[k].troubleshooting, preventative: ratings[k].preventative, calibration: ratings[k].calibration };
    })
  };

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "Submission failed");
    localStorage.removeItem(DRAFT_KEY);
    showDone();
  }catch(err){
    btn.disabled = false;
    btn.textContent = "Submit self-check";
    alert("Couldn't submit: " + err.message + "\n\nCheck your connection and try again.");
  }
}

function showDone(){
  document.getElementById("footerBar").style.display = "none";
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="done-screen">
      <p class="kicker">RainPhil field engineering</p>
      <h2>Saved — thanks, ${escapeAttr(engineerName.trim())}.</h2>
      <p>Your self-check is on record. It'll show up on the readiness dashboard shortly.</p>
      <button class="again" id="againBtn">Submit another response</button>
    </div>
  `;
  document.getElementById("againBtn").addEventListener("click", () => {
    ratings = {};
    engineerName = "";
    render();
  });
}

loadDraft();
render();
</script>

</body>
</html>
